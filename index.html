<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1720"><title>クアッドリバーシ</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif;color:#eff6f5;background:#0b1720}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 65% -20%,#1b4550,#0b1720 65%);min-height:100vh}button,select{font:inherit}button{cursor:pointer}header{max-width:1110px;margin:auto;padding:22px 24px 8px;display:flex;justify-content:space-between;align-items:center;gap:16px}h1{font-size:clamp(1.5rem,4vw,2rem);margin:0;letter-spacing:.04em}.brand{font-size:.72rem;color:#72cec2;letter-spacing:.24em;font-weight:800}.topbtn,.secondary{border:1px solid #54727a;background:#18343d;color:#e8f4f1;border-radius:12px;padding:10px 16px}.topbtn:hover,.secondary:hover{background:#25505b}main{max-width:1110px;margin:auto;padding:12px 24px 40px;display:grid;grid-template-columns:minmax(0,700px) minmax(260px,320px);gap:28px;align-items:start}.boardwrap{background:#173b3c;border:8px solid #376764;border-radius:18px;box-shadow:0 25px 60px #0007;padding:3px;max-width:700px}.board{display:grid;grid-template-columns:repeat(10,1fr);aspect-ratio:1;gap:2px}.cell{border:0;position:relative;background:#1d6d60;min-width:0;padding:0;display:grid;place-items:center;aspect-ratio:1}.cell:nth-child(odd){background:#237765}.cell.zone{background:#398377}.cell.zone:nth-child(odd){background:#428e7e}.cell.hint:after{content:'';width:22%;aspect-ratio:1;border-radius:50%;background:#ffffffa8}.cell:hover:not(:disabled){filter:brightness(1.23)}.cell:disabled{cursor:default}.stone{width:77%;height:77%;border-radius:50%;box-shadow:inset -5px -6px 9px #0004,inset 3px 4px 8px #fff6,0 3px 5px #0007;border:1px solid #ffffff66}.red{background:#f15456}.blue{background:#4899f7}.yellow{background:#f8ca48}.green{background:#59c481}.cell.last{outline:3px solid #fff9;outline-offset:-4px}.cell:focus-visible{outline:3px solid white;z-index:1}.panel{background:#142730;border:1px solid #34535a;border-radius:20px;padding:21px;box-shadow:0 14px 35px #0003}.label{color:#8bb5b8;font-size:.78rem;letter-spacing:.09em;font-weight:700}.status{font-size:1.15rem;font-weight:800;margin:10px 0 4px;line-height:1.5}.note{color:#a9c0c2;font-size:.89rem;line-height:1.6;margin:3px 0 16px}.scores{display:grid;gap:9px;margin:18px 0}.score{display:flex;justify-content:space-between;align-items:center;background:#203840;border-radius:10px;padding:10px 12px}.score.active{outline:2px solid #b9eee3}.who{display:flex;gap:9px;align-items:center;font-weight:700}.mini{width:20px;height:20px;border-radius:50%;display:inline-block;border:1px solid #ffffff66}.count{font-size:1.15rem;font-weight:800;font-variant-numeric:tabular-nums}.kind{font-size:.72rem;color:#b9cacc;font-weight:400}.rule{border-top:1px solid #3c565c;padding-top:15px;color:#c2d6d5;font-size:.85rem;line-height:1.7}.setup{position:fixed;inset:0;background:#07151cdb;display:grid;place-items:center;padding:20px;z-index:5;overflow:auto}.setup.hidden{display:none}.dialog{max-width:465px;width:100%;background:#173039;border:1px solid #518185;border-radius:24px;padding:clamp(22px,5vw,34px);box-shadow:0 25px 75px #0009}.dialog h2{font-size:1.65rem;margin:4px 0 10px}.dialog p{line-height:1.65;color:#bed0d1;margin:0 0 20px}.field{display:block;margin:17px 0 7px;font-weight:700}.choices{display:flex;gap:8px}.choices button{flex:1;border:1px solid #5a787a;background:#213e45;color:#e9f5f2;border-radius:11px;min-height:44px}.choices button.selected{background:#e3fcf4;color:#123c3b;font-weight:800;border-color:#e3fcf4}.primary{width:100%;border:0;background:#e4df85;color:#172d2c;border-radius:12px;padding:13px;font-weight:800;margin-top:20px}.primary:hover{background:#fff2a2}.tiny{font-size:.79rem;color:#9bb5b7;margin-top:12px;line-height:1.5}@media(max-width:760px){header{padding:15px 14px 5px}main{display:flex;flex-direction:column;gap:16px;padding:10px 10px 28px}.boardwrap{width:100%;border-width:5px}.panel{width:100%;padding:16px}.scores{grid-template-columns:repeat(2,1fr)}.score{padding:8px}.kind{display:block}.stone{width:78%;height:78%}.cell{gap:1px}.board{gap:1px}}

[hidden]{display:none!important}
body.title-open{background:#fff;color:#101820}
.title-screen{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;background:#fff;color:#101820;padding:24px max(20px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom));box-sizing:border-box}
.title-content{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(36px,7vh,64px);padding:40px 0}
.title-logo{display:block;width:min(100%,1100px);height:auto;overflow:hidden;flex-shrink:0}
.title-start{min-width:200px;min-height:56px;padding:14px 40px;border:2px solid #101820;border-radius:16px;background:#101820;color:#fff;font-size:1.125rem;font-weight:750;letter-spacing:.12em;transition:background .15s ease,transform .15s ease}
.title-start:hover{background:#293940;transform:translateY(-1px)}
.title-start:focus-visible{outline:3px solid #4899f7;outline-offset:5px}
.title-copyright{text-align:center;font-size:.875rem;line-height:1.6;margin:0;color:#555;flex-shrink:0}
@media(prefers-reduced-motion:reduce){.title-start{transition:none}}

.setup-back{display:block;width:100%;min-height:48px;margin-top:12px;padding:11px 16px;border:1px solid #54727a;border-radius:12px;background:transparent;color:#d6e6e6;font-size:1rem;line-height:1.5}
.setup-back:hover{background:#25434b;border-color:#82a5a9}
.setup-back:focus-visible{outline:3px solid #e4df85;outline-offset:3px}
@media(max-width:600px){
 .title-screen{padding:24px max(18px,env(safe-area-inset-right)) max(28px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}
 .title-content{gap:clamp(64px,14svh,120px);padding:64px 0 80px}
 .title-logo{width:100%}
 .title-start{width:min(100%,280px);min-height:58px;border-radius:18px}
 .title-copyright{font-size:.875rem}
 .setup{padding:24px 16px;align-items:safe center}
 .dialog{max-width:420px;padding:26px 22px;border-radius:22px}
 .dialog h2{font-size:1.5rem}
 .dialog p{font-size:1rem;line-height:1.7}
 .field{margin-top:22px}
 .choices{gap:8px}
 .choices button{min-height:48px}
 .tiny{font-size:.875rem;min-height:2.8em}
 .primary{min-height:50px;margin-top:22px}
}
@media(max-height:500px){.title-content{padding:24px 0;gap:28px}.setup{align-items:start}}
</style></head><body class="title-open"><section class="title-screen" id="title-screen" aria-label="クアッドリバーシ タイトル画面"><div class="title-content"><svg class="title-logo" viewBox="175 250 1790 208" role="img" aria-label="QUAD REVERSI"><image href="./logo.png" x="0" y="0" width="2048" height="682"/></svg><button class="title-start" id="title-start" type="button">START</button></div><p class="title-copyright">Ⓒmelon0811 All rights reserved.</p></section><div id="game-screen" hidden><header><div><div class="brand">QUAD REVERSI</div><h1>クアッドリバーシ</h1></div><button id="new" class="topbtn">新しい対局</button></header><main><section class="boardwrap" aria-label="10×10の盤面"><div class="board" id="board"></div></section><aside class="panel"><div class="label" id="phase">対局設定</div><div class="status" id="status">人数と難易度を選んでください</div><p class="note" id="detail">中央4×4を配置してから、4色で石を取り合います。</p><div class="scores" id="scores"></div><div class="rule">配置：中央の空きマスに順番に1個ずつ。16個で対局へ。<br>対局：他の色を自分の色で挟んだ列を返します。置けない色は自動パス。全員置けなくなったら石数で決着。</div></aside></main><div class="setup hidden" id="setup"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="setupTitle"><div class="brand">QUAD REVERSI</div><h2 id="setupTitle">対局を始める</h2><p>人間の人数を選び、残りはCPUが担当します。各色の手番順は毎回ランダムです。</p><label class="field">人間の人数</label><div class="choices" id="humans"></div><label class="field">CPUの難易度</label><div class="choices" id="difficulty"></div><div class="tiny" id="difficultyText"></div><button class="primary" id="start">対局開始</button><button class="setup-back" id="back-title" type="button">タイトルへ戻る</button></div></div></div><script type="module">
import {COLORS,zone,legal,counts,chooseMove,newGame,step} from './engine.mjs';
const $=id=>document.getElementById(id), css=['red','blue','yellow','green'];let humans=1,level=3,game=null,last=-1,busy=false,timer=null,serial=0,notice='';const descriptions=['','取れる石の数を重視','石数・角・次に置ける数を評価','次の色の応手も評価','応手を強めに評価','応手をさらに警戒し、終盤の石数も重視'];
function options(id,n,chosen,callback){$(id).replaceChildren();for(let i=1;i<=n;i++){let b=document.createElement('button');b.textContent=i;b.className=i===chosen?'selected':'';b.setAttribute('aria-pressed',i===chosen);b.onclick=()=>{callback(i);options(id,n,i,callback)};$(id).append(b)}}
function setup(){options('humans',4,humans,v=>humans=v);options('difficulty',5,level,v=>{level=v;$('difficultyText').textContent=descriptions[v]});$('difficultyText').textContent=descriptions[level];$('setup').classList.remove('hidden')}
function isHuman(c){return c<humans}function move(i){if(!game||game.phase==='end'||busy)return;const color=game.order[game.turn];if(!isHuman(color))return;const next=step(game,i);if(!next)return;last=i;game=next;notice='';render();schedule()}
function render(){const board=$('board');board.replaceChildren();if(!game)return;const active=game.turn<0?-1:game.order[game.turn],valid=game.phase==='play'&&active>=0?new Set(legal(game.board,active)):null;for(let i=0;i<100;i++){const b=document.createElement('button');b.className='cell'+(game.phase==='placement'&&zone(i)?' zone':'')+(i===last?' last':'');const c=game.board[i],allowed=!busy&&active>=0&&isHuman(active)&&(game.phase==='placement'?zone(i)&&c===-1:valid.has(i));if(allowed&&c===-1)b.classList.add('hint');b.disabled=!allowed;b.setAttribute('aria-label',`${Math.floor(i/10)+1}行${i%10+1}列${c>=0?COLORS[c]:'空き'}${allowed?'、配置可能':''}`);if(c>=0){const s=document.createElement('span');s.className='stone '+css[c];b.append(s)}b.onclick=()=>move(i);board.append(b)}const ct=counts(game.board);$('scores').innerHTML=COLORS.map((name,c)=>`<div class="score ${c===active?'active':''}"><span class="who"><span class="mini ${css[c]}"></span><span>${name}<span class="kind">${isHuman(c)?'あなた':'CPU'}</span></span></span><strong class="count">${ct[c]}</strong></div>`).join('');if(game.phase==='end'){const top=Math.max(...ct),win=COLORS.filter((_,c)=>ct[c]===top);$('phase').textContent='対局終了';$('status').textContent=win.length===1?`${win[0]}の勝ち！`:`${win.join('・')}の引き分け`; $('detail').textContent=`最多 ${top}個。もう一度遊ぶには「新しい対局」を押してください。`;return}$('phase').textContent=game.phase==='placement'?`配置フェーズ · ${game.moves}/16`:'対局フェーズ';$('status').textContent=`${COLORS[active]}の手番 ${isHuman(active)?'（人間）':'（CPU）'}`;$('detail').textContent=notice|| (game.phase==='placement'?`順番：${game.order.map(c=>COLORS[c]).join(' → ')}。中央4×4の空きマスを選んでください。`:isHuman(active)?`光るマスに置けます（${valid.size}か所）。`:'CPUが考えています…')}
function schedule(){if(!game||game.phase==='end')return;const c=game.order[game.turn];if(isHuman(c)){busy=false;render();return}busy=true;render();let token=serial;timer=setTimeout(()=>{if(token!==serial||!game)return;const color=game.order[game.turn];const i=chooseMove(game.board,color,game.phase,level,Math.random,game.order);if(i<0){busy=false;return}const before=game.turn,old=game.phase;game=step(game,i);last=i;notice='';if(old==='play'&&game.phase==='play'){const skipped=(game.turn-before+4)%4;if(skipped>1)notice=`${skipped-1}色は置けずにパスしました。`}render();schedule()},350)}
$('new').onclick=()=>{clearTimeout(timer);serial++;busy=false;setup()};$('start').onclick=()=>{clearTimeout(timer);serial++;last=-1;busy=false;game=newGame();$('setup').classList.add('hidden');render();schedule()};
$('title-start').onclick=()=>{$('title-screen').hidden=true;$('game-screen').hidden=false;document.body.classList.remove('title-open');setup();$('humans').querySelector('button').focus()};
$('back-title').onclick=()=>{clearTimeout(timer);timer=null;serial++;busy=false;game=null;last=-1;notice='';$('setup').classList.add('hidden');$('game-screen').hidden=true;$('title-screen').hidden=false;document.body.classList.add('title-open');$('title-start').focus()};
</script></body></html>
