<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1720"><title>クアッドリバーシ</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif;color:#eff6f5;background:#0b1720}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 65% -20%,#1b4550,#0b1720 65%);min-height:100vh}button,select{font:inherit}button{cursor:pointer}header{max-width:1110px;margin:auto;padding:22px 24px 8px;display:flex;justify-content:space-between;align-items:center;gap:16px}h1{font-size:clamp(1.5rem,4vw,2rem);margin:0;letter-spacing:.04em}.brand{font-size:.72rem;color:#72cec2;letter-spacing:.24em;font-weight:800}.topbtn,.secondary{border:1px solid #54727a;background:#18343d;color:#e8f4f1;border-radius:12px;padding:10px 16px}.topbtn:hover,.secondary:hover{background:#25505b}main{max-width:1110px;margin:auto;padding:12px 24px 40px;display:grid;grid-template-columns:minmax(0,700px) minmax(260px,320px);gap:28px;align-items:start}.boardwrap{background:#173b3c;border:8px solid #376764;border-radius:18px;box-shadow:0 25px 60px #0007;padding:3px;max-width:700px}.board{display:grid;grid-template-columns:repeat(10,1fr);aspect-ratio:1;gap:2px}.cell{border:0;position:relative;background:#1d6d60;min-width:0;padding:0;display:grid;place-items:center;aspect-ratio:1}.cell:nth-child(odd){background:#237765}.cell.zone{background:#398377}.cell.zone:nth-child(odd){background:#428e7e}.cell.hint:after{content:'';width:22%;aspect-ratio:1;border-radius:50%;background:#ffffffa8}.cell:hover:not(:disabled){filter:brightness(1.23)}.cell:disabled{cursor:default}.stone{width:77%;height:77%;border-radius:50%;box-shadow:inset -5px -6px 9px #0004,inset 3px 4px 8px #fff6,0 3px 5px #0007;border:1px solid #ffffff66}.red{background:#f15456}.blue{background:#4899f7}.yellow{background:#f8ca48}.green{background:#59c481}.cell.last{outline:3px solid #fff9;outline-offset:-4px}.cell:focus-visible{outline:3px solid white;z-index:1}.panel{background:#142730;border:1px solid #34535a;border-radius:20px;padding:21px;box-shadow:0 14px 35px #0003}.label{color:#8bb5b8;font-size:.78rem;letter-spacing:.09em;font-weight:700}.status{font-size:1.15rem;font-weight:800;margin:10px 0 4px;line-height:1.5}.note{color:#a9c0c2;font-size:.89rem;line-height:1.6;margin:3px 0 16px}.scores{display:grid;gap:9px;margin:18px 0}.score{display:flex;justify-content:space-between;align-items:center;background:#203840;border-radius:10px;padding:10px 12px}.score.active{outline:2px solid #b9eee3}.who{display:flex;gap:9px;align-items:center;font-weight:700}.mini{width:20px;height:20px;border-radius:50%;display:inline-block;border:1px solid #ffffff66}.count{font-size:1.15rem;font-weight:800;font-variant-numeric:tabular-nums}.kind{font-size:.72rem;color:#b9cacc;font-weight:400}.rule{border-top:1px solid #3c565c;padding-top:15px;color:#c2d6d5;font-size:.85rem;line-height:1.7}.setup{position:fixed;inset:0;background:#07151cdb;display:grid;place-items:center;padding:20px;z-index:5;overflow:auto}.setup.hidden{display:none}.dialog{max-width:465px;width:100%;background:#173039;border:1px solid #518185;border-radius:24px;padding:clamp(22px,5vw,34px);box-shadow:0 25px 75px #0009}.dialog h2{font-size:1.65rem;margin:4px 0 10px}.dialog p{line-height:1.65;color:#bed0d1;margin:0 0 20px}.field{display:block;margin:17px 0 7px;font-weight:700}.choices{display:flex;gap:8px}.choices button{flex:1;border:1px solid #5a787a;background:#213e45;color:#e9f5f2;border-radius:11px;min-height:44px}.choices button.selected{background:#e3fcf4;color:#123c3b;font-weight:800;border-color:#e3fcf4}.primary{width:100%;border:0;background:#e4df85;color:#172d2c;border-radius:12px;padding:13px;font-weight:800;margin-top:20px}.primary:hover{background:#fff2a2}.tiny{font-size:.79rem;color:#9bb5b7;margin-top:12px;line-height:1.5}@media(max-width:760px){header{padding:15px 14px 5px}main{display:flex;flex-direction:column;gap:16px;padding:10px 10px 28px}.boardwrap{width:100%;border-width:5px}.panel{width:100%;padding:16px}.scores{grid-template-columns:repeat(2,1fr)}.score{padding:8px}.kind{display:block}.stone{width:78%;height:78%}.cell{gap:1px}.board{gap:1px}}

</style></head><body class="title-open"><section class="title-screen" id="title-screen" data-i18n-aria="titleAria" aria-label="クアッドリバーシ タイトル画面"><div class="title-toolbar"><button class="lang-toggle" type="button">ENGLISH</button><button class="bgm-toggle" type="button" aria-pressed="false">♪ BGM OFF</button></div><div class="title-content"><svg class="title-logo" viewBox="175 250 1790 208" role="img" aria-label="QUAD REVERSI"><image href="./logo.png" x="0" y="0" width="2048" height="682"/></svg><button class="title-start" id="title-start" type="button">START</button></div><p class="title-copyright"><span class="version title-version">Ver. 1.2</span>Ⓒmelon0811 All rights reserved.</p></section><div id="game-screen" hidden><header><div><div class="brand">QUAD REVERSI</div><h1 data-i18n="title">クアッドリバーシ</h1></div><div class="header-actions"><button class="lang-toggle" type="button">ENGLISH</button><button class="bgm-toggle" type="button" aria-pressed="false">♪ BGM OFF</button><button id="new" class="topbtn" data-i18n="newGame">新しい対局</button></div></header><main><section class="boardwrap" data-i18n-aria="boardAria" aria-label="10×10の盤面"><div class="board" id="board"></div></section><aside class="panel"><div class="label" id="phase">対局設定</div><div class="status" id="status">人数と難易度を選んでください</div><p class="note" id="detail">中央4×4を配置してから、4色で石を取り合います。</p><div class="scores" id="scores"></div><div class="rule" data-i18n="rules">配置：中央の空きマスに順番に1個ずつ。16個で対局へ。<br>対局：他の色を自分の色で挟んだ列を返します。置けない色は自動パス。全員置けなくなったら石数で決着。</div></aside></main><div class="setup hidden" id="setup"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="setupTitle"><div class="setup-heading"><div class="brand">QUAD REVERSI</div><span class="version">Ver. 1.2</span></div><h2 id="setupTitle" data-i18n="setupTitle">対局を始める</h2><p data-i18n="setupIntro">人間の人数を選び、残りはCPUが担当します。各色の手番順は毎回ランダムです。</p><p class="placement-note" data-i18n="randomPlacement">CPUの最初の4枚はランダムに配置します。</p><div class="setup-audio"><button class="lang-toggle" type="button">ENGLISH</button><button class="bgm-toggle" type="button" aria-pressed="false">♪ BGM OFF</button></div><label class="field" data-i18n="humans">人間の人数</label><div class="choices" id="humans"></div><label class="field" data-i18n="difficulty">CPUの難易度</label><div class="choices" id="difficulty"></div><div class="tiny" id="difficultyText"></div><button class="primary" id="start" data-i18n="startGame">対局開始</button><button class="setup-back" id="back-title" data-i18n="backTitle" type="button">タイトルへ戻る</button></div></div></div><section class="result-screen" id="result-screen" hidden><div class="result-card" role="dialog" aria-modal="true" aria-labelledby="winner-name"><div class="result-audio"><button class="lang-toggle" type="button">ENGLISH</button><button class="bgm-toggle" type="button" aria-pressed="false">♪ BGM OFF</button></div><div class="result-trophy" aria-hidden="true">🏆</div><div class="result-kicker" id="winner-label">WINNER</div><h2 id="winner-name"></h2><p class="result-summary" id="result-summary"></p><ol class="rank-list" id="rank-list"></ol><button class="primary" id="play-again" data-i18n="again" type="button">もう一度遊ぶ</button><button class="setup-back" id="view-board" data-i18n="viewBoard" type="button">盤面を見る</button></div></section><script type="module">
import {zone,legal,counts,chooseMove,newGame,step,rankings} from './engine.mjs';
import {createAudio} from './audio.mjs';
import {t,getLanguage,setLanguage} from './i18n.mjs';
const $=id=>document.getElementById(id),css=['red','blue','yellow','green'],audio=createAudio();
let humans=1,level=3,game=null,last=-1,busy=false,timer=null,serial=0,notice=0,resultShown=false;
let COLORS=t('colors');
function updateBgm(){document.querySelectorAll('.bgm-toggle').forEach(button=>{button.textContent=audio.enabled?'♪ BGM ON':'♪ BGM OFF';button.setAttribute('aria-pressed',String(audio.enabled));button.setAttribute('aria-label',t(audio.enabled?'bgmOff':'bgmOn'))})}
document.querySelectorAll('.bgm-toggle').forEach(button=>button.onclick=async()=>{await audio.toggle();updateBgm()});updateBgm();
function options(id,n,chosen,callback){$(id).replaceChildren();for(let i=1;i<=n;i++){const b=document.createElement('button');b.textContent=i;b.className=i===chosen?'selected':'';b.setAttribute('aria-pressed',i===chosen);b.onclick=()=>{callback(i);options(id,n,i,callback)};$(id).append(b)}}
function cancelTurn(){clearTimeout(timer);timer=null;serial++;busy=false}
function setup(){cancelTurn();audio.stopEffects();$('result-screen').hidden=true;options('humans',4,humans,v=>humans=v);options('difficulty',5,level,v=>{level=v;$('difficultyText').textContent=t('descriptions')[v]});$('difficultyText').textContent=t('descriptions')[level];$('setup').classList.remove('hidden');$('humans').querySelector('button').focus()}
function isHuman(c){return c<humans}
function playerName(c){return isHuman(c)?t('player',{number:String(c+1).replace(/[0-9]/g,d=>String.fromCharCode(d.charCodeAt(0)+0xfee0))}):'CPU'}
function applyMove(i){const before=game.turn,old=game.phase,next=step(game,i);if(!next)return false;game=next;last=i;notice=0;audio.click();if(old==='play'&&game.phase==='play'){const skipped=(game.turn-before+4)%4;if(skipped>1)notice=skipped-1}render();schedule();return true}
function move(i){if(!game||game.phase==='end'||busy||!isHuman(game.order[game.turn]))return;audio.unlock();applyMove(i)}
function showResult(refresh=false){if(resultShown&&!refresh)return;resultShown=true;busy=false;const rows=rankings(game.board),winners=rows.filter(r=>r.rank===1);$('winner-label').textContent=winners.length===1?'WINNER':'DRAW';$('winner-name').textContent=t(winners.length===1?'win':'draw',{colors:winners.map(r=>COLORS[r.color]).join(t('join'))});$('result-summary').textContent=t(winners.length===1?'resultWin':'resultDraw',{score:rows[0].score});$('rank-list').innerHTML=rows.map(r=>`<li class="rank-row ${r.rank===1?'winner':''}"><span class="rank-number">${t('rank',{rank:r.rank})}</span><span class="mini ${css[r.color]}" aria-hidden="true"></span><span>${COLORS[r.color]} <span class="kind">${playerName(r.color)}</span></span><span class="rank-score">${r.score}<small> ${t('stones')}</small></span></li>`).join('');if(!refresh){$('result-screen').hidden=false;audio.cheer();$('play-again').focus()}}
function render(){const board=$('board');board.replaceChildren();if(!game)return;const active=game.turn<0?-1:game.order[game.turn],valid=game.phase==='play'&&active>=0?new Set(legal(game.board,active)):null;for(let i=0;i<100;i++){const b=document.createElement('button');b.className='cell'+(game.phase==='placement'&&zone(i)?' zone':'')+(i===last?' last':'');const c=game.board[i],allowed=!busy&&active>=0&&isHuman(active)&&(game.phase==='placement'?zone(i)&&c===-1:valid.has(i));if(allowed&&c===-1)b.classList.add('hint');b.disabled=!allowed;b.setAttribute('aria-label',t('cell',{row:Math.floor(i/10)+1,col:i%10+1,color:c>=0?COLORS[c]:t('empty'),hint:allowed?', '+t('available'):''}));if(c>=0){const s=document.createElement('span');s.className='stone '+css[c];b.append(s)}b.onclick=()=>move(i);board.append(b)}const ct=counts(game.board);$('scores').innerHTML=COLORS.map((name,c)=>`<div class="score ${c===active?'active':''}"><span class="who"><span class="mini ${css[c]}"></span><span>${name} <span class="kind">${playerName(c)}</span></span></span><strong class="count">${ct[c]}</strong></div>`).join('');if(game.phase==='end'){const top=Math.max(...ct),win=COLORS.filter((_,c)=>ct[c]===top);$('phase').textContent=t('ended');$('status').textContent=t(win.length===1?'win':'draw',{colors:win.join(t('join'))}); $('detail').textContent=t('endDetail',{score:top});showResult();return}$('phase').textContent=game.phase==='placement'?t('placement',{moves:game.moves}):t('play');$('status').textContent=t('turn',{color:COLORS[active],kind:playerName(active)});$('detail').textContent=notice?t('passed',{count:notice}):(game.phase==='placement'?t('order',{order:game.order.map(c=>COLORS[c]).join(' → ')}):isHuman(active)?t('legal',{count:valid.size}):t('thinking'))}

function schedule(){if(!game||game.phase==='end')return;const c=game.order[game.turn];if(isHuman(c)){busy=false;render();return}busy=true;render();const token=serial;timer=setTimeout(()=>{if(token!==serial||!game)return;const i=chooseMove(game.board,game.order[game.turn],game.phase,level,Math.random,game.order);if(i<0){busy=false;return}applyMove(i)},350)}
$('new').onclick=setup;
$('start').onclick=()=>{audio.unlock();audio.stopEffects();cancelTurn();last=-1;notice=0;resultShown=false;game=newGame();$('result-screen').hidden=true;$('setup').classList.add('hidden');render();schedule()};
$('title-start').onclick=()=>{audio.unlock();$('title-screen').hidden=true;$('game-screen').hidden=false;document.body.classList.remove('title-open');setup()};
$('back-title').onclick=()=>{cancelTurn();audio.stopEffects();game=null;last=-1;notice=0;resultShown=false;$('result-screen').hidden=true;$('setup').classList.add('hidden');$('game-screen').hidden=true;$('title-screen').hidden=false;document.body.classList.add('title-open');$('title-start').focus()};
$('play-again').onclick=setup;
$('view-board').onclick=()=>{$('result-screen').hidden=true;audio.stopEffects();$('new').focus()};

function refreshLanguage(){document.documentElement.lang=getLanguage();document.title=t('title');COLORS=t('colors');document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));document.querySelectorAll('[data-i18n-aria]').forEach(el=>el.setAttribute('aria-label',t(el.dataset.i18nAria)));document.querySelectorAll('.lang-toggle').forEach(el=>{el.textContent=getLanguage()==='ja'?'ENGLISH':'日本語';el.setAttribute('aria-label',getLanguage()==='ja'?'Switch to English':'日本語に切り替える')});$('difficultyText').textContent=t('descriptions')[level];updateBgm();if(game){render();if(game.phase==='end')showResult(true)}else{$('phase').textContent=t('setupPhase');$('status').textContent=t('setupStatus');$('detail').textContent=t('setupDetail')}}
document.querySelectorAll('.lang-toggle').forEach(el=>el.onclick=()=>{setLanguage(getLanguage()==='ja'?'en':'ja');refreshLanguage()});refreshLanguage();
</script></body></html>
